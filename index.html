<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>NFC Games</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      min-height: 100vh;

      background: #111;
      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;

      padding: 30px 20px;

    }

    .contenedor {

      width: 100%;
      max-width: 430px;

      text-align: center;

    }

    h1 {

      margin-bottom: 5px;
      font-size: 32px;

    }

    .subtitulo {

      color: #aaa;
      margin-bottom: 30px;

    }

    .juego {

      display: block;

      width: 100%;

      padding: 18px 15px;

      margin-bottom: 14px;

      background: #222;

      border: 1px solid #444;
      border-radius: 12px;

      color: white;

      text-decoration: none;

      font-size: 17px;
      font-weight: bold;

      transition: 0.1s;

    }

    .numero {

      display: block;

      margin-top: 5px;

      color: #888;

      font-size: 12px;
      font-weight: normal;

    }

    .juego:active {

      transform: scale(0.98);

      background: #333;

    }

    .nota {

      margin-top: 30px;

      color: #777;

      font-size: 13px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <h1>NFC Games</h1>

    <div class="subtitulo">
      Panel de pruebas
    </div>


    <a
      class="juego"
      href="./juegos/juego-1/">

      Pokémon Rojo

      <span class="numero">
        Juego 1
      </span>

    </a>


    <a
      class="juego"
      href="./juegos/juego-2/">

      The Legend of Zelda:
      Link's Awakening

      <span class="numero">
        Juego 2
      </span>

    </a>


    <a
      class="juego"
      href="./juegos/juego-3/">

      Donkey Kong Country

      <span class="numero">
        Juego 3
      </span>

    </a>


    <a
      class="juego"
      href="./juegos/juego-4/">

      Pokémon Amarillo

      <span class="numero">
        Juego 4
      </span>

    </a>


    <a
      class="juego"
      href="./juegos/juego-5/">

      Super Mario Land 2

      <span class="numero">
        Juego 5
      </span>

    </a>


    <a
      class="juego"
      href="./juegos/juego-6/">

      Tetris 2

      <span class="numero">
        Juego 6
      </span>

    </a>


    <div class="nota">

      Cada juego conserva
      su propia partida.

    </div>


  </div>


</body>

</html>
