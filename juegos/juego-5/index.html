<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>NFC Games</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/binji/binjgb@main/docs/simple.css"
  >

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;

      overflow: hidden;

    }

  </style>

</head>


<body>


  <!-- ===================================== -->
  <!-- PANTALLA DEL JUEGO                    -->
  <!-- ===================================== -->

  <div id="game">

    <canvas
      id="mainCanvas"
      width="160"
      height="144">
    </canvas>

  </div>



  <!-- ===================================== -->
  <!-- CONTROLES                             -->
  <!-- ===================================== -->

  <div id="controller">


    <div id="controller_dpad">

      <div id="controller_left"></div>
      <div id="controller_right"></div>
      <div id="controller_up"></div>
      <div id="controller_down"></div>

    </div>


    <div
      id="controller_select"
      class="capsuleBtn">
      Select
    </div>


    <div
      id="controller_start"
      class="capsuleBtn">
      Start
    </div>


    <div
      id="controller_b"
      class="roundBtn">
      B
    </div>


    <div
      id="controller_a"
      class="roundBtn">
      A
    </div>


  </div>



  <!-- ===================================== -->
  <!-- CONFIGURACIÓN DEL JUEGO               -->
  <!-- ===================================== -->

  <script>

    /*
      ======================================
      SOLO CAMBIAR ESTAS DOS LÍNEAS
      PARA CADA JUEGO NUEVO
      ======================================
    */


    window.NFC_ROM =
      "../../roms/juego-5.gb";


    window.NFC_ID =
      "juego-5";


    /*
      NO MODIFICAR DE AQUÍ HACIA ABAJO
    */


    document.title =
      window.NFC_ID + " - NFC Games";

  </script>



  <!-- ===================================== -->
  <!-- SELECCIONAR LA ROM                    -->
  <!-- ===================================== -->

  <script>

    const fetchOriginal =
      window.fetch.bind(window);


    window.fetch =
      function(recurso, opciones) {


        const url =

          typeof recurso === "string"

          ? recurso

          : recurso.url;



        if (
          url.endsWith("porklike.gb")
        ) {


          return fetchOriginal(

            window.NFC_ROM,

            opciones

          );


        }


        return fetchOriginal(

          recurso,

          opciones

        );


      };

  </script>



  <!-- ===================================== -->
  <!-- GUARDADO INDEPENDIENTE                -->
  <!-- ===================================== -->

  <script>

    (() => {


      /*
        Ejemplo:

        juego-3
        ↓
        juego-3_saveState
        juego-3_extram
      */


      const PREFIJO =

        window.NFC_ID + "_";



      const getOriginal =
        Storage.prototype.getItem;


      const setOriginal =
        Storage.prototype.setItem;


      const removeOriginal =
        Storage.prototype.removeItem;



      const clavesDelJuego = [

        "saveState",

        "extram"

      ];



      function claveJuego(clave) {


        if (
          clavesDelJuego.includes(clave)
        ) {


          return (
            PREFIJO + clave
          );


        }


        return clave;


      }



      /*
        LECTURA
      */


      Storage.prototype.getItem =

        function(clave) {


          if (
            this === localStorage
          ) {


            clave =
              claveJuego(clave);


          }


          return getOriginal.call(

            this,

            clave

          );


        };



      /*
        GUARDADO
      */


      Storage.prototype.setItem =

        function(clave, valor) {


          if (
            this === localStorage
          ) {


            clave =
              claveJuego(clave);


          }


          return setOriginal.call(

            this,

            clave,

            valor

          );


        };



      /*
        BORRADO
      */


      Storage.prototype.removeItem =

        function(clave) {


          if (
            this === localStorage
          ) {


            clave =
              claveJuego(clave);


          }


          return removeOriginal.call(

            this,

            clave

          );


        };


    })();

  </script>



  <!-- ===================================== -->
  <!-- CARGAR BINJGB                         -->
  <!-- ===================================== -->


  <script
    src="https://cdn.jsdelivr.net/gh/binji/binjgb@main/docs/binjgb.js">
  </script>


  <script
    src="https://cdn.jsdelivr.net/gh/binji/binjgb@main/docs/simple.js">
  </script>



  <!-- ===================================== -->
  <!-- AUTOGUARDADO                          -->
  <!-- ===================================== -->

  <script>


    let estadoRestaurado =
      false;



    /*
      Esperar a que el emulador
      termine de cargar.
    */


    const esperarEmulador =

      setInterval(

        () => {


          if (

            typeof emulator !== "undefined"

            &&

            emulator

            &&

            !estadoRestaurado

          ) {


            estadoRestaurado =
              true;


            clearInterval(
              esperarEmulador
            );



            /*
              RESTAURAR PARTIDA
            */


            if (

              localStorage.getItem(
                "saveState"
              )

            ) {


              try {


                emulator.loadState();


                console.log(
                  "Partida restaurada: "
                  + window.NFC_ID
                );


              }


              catch (error) {


                console.log(

                  "No se pudo restaurar:",

                  error

                );


              }


            }



            /*
              AUTOGUARDADO
              CADA 10 SEGUNDOS
            */


            setInterval(

              () => {


                try {


                  if (emulator) {


                    emulator.saveState();


                    console.log(

                      "Partida guardada: "
                      + window.NFC_ID

                    );


                  }


                }


                catch (error) {


                  console.log(

                    "Error al guardar:",

                    error

                  );


                }


              },

              10000

            );


          }


        },

        500

      );



    /*
      GUARDAR AL CAMBIAR
      DE APLICACIÓN
    */


    document.addEventListener(

      "visibilitychange",

      () => {


        if (

          document.hidden

          &&

          typeof emulator !== "undefined"

          &&

          emulator

        ) {


          try {


            emulator.saveState();


          }


          catch (error) {


            console.log(

              "Error al guardar al salir:",

              error

            );


          }


        }


      }

    );



    /*
      GUARDAR AL CERRAR
      SAFARI / CHROME
    */


    window.addEventListener(

      "pagehide",

      () => {


        if (

          typeof emulator !== "undefined"

          &&

          emulator

        ) {


          try {


            emulator.saveState();


          }


          catch (error) {


            console.log(

              "Error al cerrar:",

              error

            );


          }


        }


      }

    );


  </script>


</body>

</html>
