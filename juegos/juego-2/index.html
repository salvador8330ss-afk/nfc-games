<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Juego 2 - NFC Games</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/binji/binjgb@main/docs/simple.css"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
  </style>

</head>

<body>

  <div id="game">
    <canvas
      id="mainCanvas"
      width="160"
      height="144">
    </canvas>
  </div>


  <div id="controller">

    <div id="controller_dpad">
      <div id="controller_left"></div>
      <div id="controller_right"></div>
      <div id="controller_up"></div>
      <div id="controller_down"></div>
    </div>

    <div
      id="controller_select"
      class="capsuleBtn">
      Select
    </div>

    <div
      id="controller_start"
      class="capsuleBtn">
      Start
    </div>

    <div
      id="controller_b"
      class="roundBtn">
      B
    </div>

    <div
      id="controller_a"
      class="roundBtn">
      A
    </div>

  </div>


  <!-- ROM DEL JUEGO 2 -->
  <script>

    const fetchOriginal =
      window.fetch.bind(window);

    window.fetch =
      function(recurso, opciones) {

        const url =
          typeof recurso === "string"
          ? recurso
          : recurso.url;

        if (
          url.endsWith("porklike.gb")
        ) {

          return fetchOriginal(
            "../../roms/juego-2.gbc",
            opciones
          );

        }

        return fetchOriginal(
          recurso,
          opciones
        );

      };

  </script>


  <!-- GUARDADO INDEPENDIENTE DEL JUEGO 2 -->
  <script>

    (() => {

      /*
        Usamos una clave nueva y limpia.
        NO copiamos ninguna partida anterior.
      */

      const PREFIJO =
        "juego-2-v2_";


      const getOriginal =
        Storage.prototype.getItem;

      const setOriginal =
        Storage.prototype.setItem;

      const removeOriginal =
        Storage.prototype.removeItem;


      const clavesDelJuego = [
        "saveState",
        "extram"
      ];


      function nuevaClave(clave) {

        if (
          clavesDelJuego.includes(clave)
        ) {

          return (
            PREFIJO + clave
          );

        }

        return clave;

      }


      Storage.prototype.getItem =
        function(clave) {

          if (
            this === localStorage
          ) {

            clave =
              nuevaClave(clave);

          }

          return getOriginal.call(
            this,
            clave
          );

        };


      Storage.prototype.setItem =
        function(clave, valor) {

          if (
            this === localStorage
          ) {

            clave =
              nuevaClave(clave);

          }

          return setOriginal.call(
            this,
            clave,
            valor
          );

        };


      Storage.prototype.removeItem =
        function(clave) {

          if (
            this === localStorage
          ) {

            clave =
              nuevaClave(clave);

          }

          return removeOriginal.call(
            this,
            clave
          );

        };

    })();

  </script>


  <!-- BINJGB -->
  <script
    src="https://cdn.jsdelivr.net/gh/binji/binjgb@main/docs/binjgb.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/gh/binji/binjgb@main/docs/simple.js">
  </script>


  <!-- AUTOGUARDADO -->
  <script>

    let estadoRestaurado =
      false;


    const esperarEmulador =

      setInterval(

        () => {

          if (
            typeof emulator !== "undefined"
            &&
            emulator
            &&
            !estadoRestaurado
          ) {

            estadoRestaurado =
              true;

            clearInterval(
              esperarEmulador
            );


            /*
              Solo restaura si ESTE juego
              ya tiene una partida propia.
            */

            if (
              localStorage.getItem(
                "saveState"
              )
            ) {

              try {

                emulator.loadState();

                console.log(
                  "Partida de Juego 2 restaurada"
                );

              }

              catch (error) {

                console.log(
                  "No se pudo restaurar la partida:",
                  error
                );

              }

            }


            /*
              AUTOGUARDADO CADA 10 SEGUNDOS
            */

            setInterval(

              () => {

                try {

                  if (emulator) {

                    emulator.saveState();

                    console.log(
                      "Juego 2 guardado automáticamente"
                    );

                  }

                }

                catch (error) {

                  console.log(
                    "Error al guardar:",
                    error
                  );

                }

              },

              10000

            );

          }

        },

        500

      );


    /*
      GUARDAR AL CAMBIAR DE APP
    */

    document.addEventListener(

      "visibilitychange",

      () => {

        if (
          document.hidden
          &&
          typeof emulator !== "undefined"
          &&
          emulator
        ) {

          try {

            emulator.saveState();

          }

          catch (error) {

            console.log(
              "Error al guardar al salir:",
              error
            );

          }

        }

      }

    );


    /*
      GUARDAR AL CERRAR SAFARI
    */

    window.addEventListener(

      "pagehide",

      () => {

        if (
          typeof emulator !== "undefined"
          &&
          emulator
        ) {

          try {

            emulator.saveState();

          }

          catch (error) {

            console.log(
              "Error al cerrar:",
              error
            );

          }

        }

      }

    );

  </script>

</body>

</html>
